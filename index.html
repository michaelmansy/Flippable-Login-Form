<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flippable Login Form</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="card" id="card">
            <!-- Front form sign in  -->
            <div class="face front">
                <div class="header">
                    <h2>Welcome Back</h2>
                    <p>Please enter your details to continue</p>
                </div>
                <div class="inputs">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">      
                </div>
                <button class="submit">Sign In</button>
                <div class="footer">
                    <p>Don't have an account? <span id="flip">Sign Up</span></p>
                </div>
            </div>

            <!-- Back form sign up -->
            <div class="face back">
                <div class="header">
                    <h2>Create Account</h2>
                    <p>Start your journey with us</p>
                </div>
                <div class="inputs">
                    <input type="text" placeholder="Full Name">
                    <input type="email" placeholder="Email Address">
                    <input type="password" placeholder="Password">
                </div>
                <button class="submit">Get Started</button>
                <div class="footer">
                    <p>Already a member? <span id="flip">Sign In</span></p>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
